spring.application.name=AutoEscola3ESS
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3ess?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

api.security.token.secret=${JWT_SECRET:12345678}

# CORS - origens permitidas (separadas por vírgula)
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# API externa (ViaCEP)
api.viacep.url=https://viacep.com.br/ws

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
